openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agent
    description: AI coding-agent interactions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /agent/turn:
    post:
      operationId: sendAgentTurn
      tags: [agent]
      summary: Send a message to the AI coding agent
      description: Returns a server-sent event stream of assistant text chunks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTurnInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AgentTurnInput:
      type: object
      properties:
        mode:
          type: string
          enum: [plan, build, edit]
        request:
          type: string
          minLength: 1
          maxLength: 12000
        files:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AgentFile"
        history:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AgentChatMessage"
      required: [mode, request, files, history]
    AgentFile:
      type: object
      properties:
        path:
          type: string
          maxLength: 240
        content:
          type: string
          maxLength: 40000
      required: [path, content]
    AgentChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 12000
      required: [role, content]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]


name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Install, Codegen, Typecheck and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: pnpm/action-setup@v2
        with:
          node-version: '24'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies (workspace)
        run: pnpm -w install --frozen-lockfile

      - name: Run OpenAPI codegen (Orval)
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Full workspace typecheck
        run: pnpm -w run typecheck

      - name: Build workspace (includes frontend PWA and server bundles)
        run: pnpm -w run build

      - name: Build frontend (explicit PWA build for mobile website)
        run: pnpm --filter @workspace/buildflow run build
